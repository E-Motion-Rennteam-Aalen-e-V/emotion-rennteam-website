                    failed.push({
                      title: spec.title,
                      error: test.results?.[0]?.error?.message || 'Unbekannter Fehler',
                    });
                  }
                }
              }
            }

            if (failed.length === 0) return;

            const failList = failed.map(f =>
              `### \`${f.title}\`\n\`\`\`\n${f.error.substring(0, 500)}\n\`\`\``
            ).join('\n\n');

            const body = `## 🔴 P0 KRITISCH – CMS-Authentifizierung oder Content-Editing defekt

**Branch:** \`${branch}\`
**CI-Run:** ${runUrl}
**Datum:** ${new Date().toISOString().split('T')[0]}
**Fehlgeschlagene CMS-Tests:** ${failed.length}

---

${failList}

---

