name: Branch E2E Agent – Endnutzer-Test

on:
  push:
    branches:
      - website
      - "claude/**"
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to test (leave empty for current)"
        required: false

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-website:
    name: "E2E – Website (Endnutzer-Perspektive)"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Playwright Browser installieren
        run: npx playwright install --with-deps chromium

      - name: TypeScript-Check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Next.js Build erstellen
        run: npm run build

      - name: E2E-Tests ausführen (Endnutzer-Flows)
        id: e2e
        run: npx playwright test --reporter=json,html
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json

      - name: Testergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.ref_name }}-${{ github.run_id }}
          path: |
            playwright-report/
            playwright-results.json
          retention-days: 30

      - name: Test-Zusammenfassung generieren
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let resultJson = {};
            try {
              resultJson = JSON.parse(fs.readFileSync('playwright-results.json', 'utf8'));
            } catch (e) {
              console.log('Kein JSON-Report gefunden:', e.message);
              return;
            }

            let passed = 0, failed = 0, skipped = 0, timedOut = 0;
            const failedTests = [];

            for (const suite of (resultJson.suites || [])) {
              for (const spec of (suite.specs || [])) {
                for (const test of (spec.tests || [])) {
                  if (test.status === 'passed') passed++;
                  else if (test.status === 'failed') { failed++; failedTests.push({ title: spec.title, file: suite.file, error: test.results?.[0]?.error?.message || 'Unbekannter Fehler' }); }
                  else if (test.status === 'timedOut') { timedOut++; failedTests.push({ title: spec.title, file: suite.file, error: 'Timeout' }); }
                  else skipped++;
                }
              }
            }

            const total = passed + failed + skipped + timedOut;
            const passRate = total > 0 ? Math.round((passed / total) * 100) : 0;
            const icon = failed + timedOut === 0 ? '✅' : failed + timedOut > 3 ? '🔴' : '🟠';

            const summary = [
              `## ${icon} E2E-Testergebnis`,
              '',
              `| Metrik | Wert |`,
              `|--------|------|`,
              `| ✅ Bestanden | ${passed} |`,
              `| ❌ Fehlgeschlagen | ${failed} |`,
              `| ⏱️ Timeout | ${timedOut} |`,
              `| ⏭️ Übersprungen | ${skipped} |`,
              `| 📊 Bestehensrate | ${passRate}% |`,
            ].join('\n');

            await core.summary.addRaw(summary).write();

      - name: Fehlgeschlagene Tests als Issue dokumentieren
        if: steps.e2e.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const branch = context.ref.replace('refs/heads/', '');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let resultJson = {};
            try {
              resultJson = JSON.parse(fs.readFileSync('playwright-results.json', 'utf8'));
            } catch (e) {
              console.log('Kein JSON-Report gefunden:', e.message);
            }

            const failed = [];
            for (const suite of (resultJson.suites || [])) {
              for (const spec of (suite.specs || [])) {
                for (const test of (spec.tests || [])) {
                  if (test.status === 'failed' || test.status === 'timedOut') {
                    failed.push({
                      title: spec.title,
                      file: suite.file || '',
                      error: test.results?.[0]?.error?.message || 'Unbekannter Fehler',
                      duration: test.results?.[0]?.duration || 0,
                    });
                  }
                }
              }
            }

            if (failed.length === 0) return;

            // Priorität bestimmen
            const hasCritical = failed.some(f =>
              ['navigation', 'hero', 'home', 'page-load', '404', 'meta'].some(k =>
                f.title.toLowerCase().includes(k) || f.file.toLowerCase().includes(k)
              )
            );
            const priority = hasCritical ? '🔴 P0 KRITISCH' : '🟠 P1 HOCH';
            const priorityLabel = hasCritical ? 'P0-critical' : 'P1-high';

            const failList = failed.map(f =>
              [
                `### \`${f.title}\``,
                `**Datei:** \`${f.file}\` · **Dauer:** ${(f.duration / 1000).toFixed(1)}s`,
                '```',
                f.error.substring(0, 600),
                '```',
              ].join('\n')
            ).join('\n\n');

            const body = [
              `## ${priority} – E2E-Tests fehlgeschlagen`,
              '',
              `| | |`,
              `|---|---|`,
              `| **Branch** | \`${branch}\` |`,
              `| **CI-Run** | [Workflow ansehen](${runUrl}) |`,
              `| **Datum** | ${new Date().toISOString().split('T')[0]} |`,
              `| **Fehlgeschlagen** | ${failed.length} Test(s) |`,
              '',
              '---',
              '',
              '## Fehlgeschlagene Tests',
              '',
              failList,
              '',
              '---',
              '',
              '## Nächste Schritte',
              '',
              '1. **Report herunterladen:** CI-Artifact `playwright-report-*` enthält den vollständigen HTML-Report',
              '2. **Lokal reproduzieren:** `npx playwright test --headed`',
              '3. **Einzelnen Test debuggen:** `npx playwright test --debug <testname>`',
              '4. **Fix implementieren** und Branch pushen – CI prüft automatisch erneut',
              '',
              '*Automatisch erstellt durch Branch E2E Agent Workflow*',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');

            // Bestehendes offenes Issue für diesen Branch aktualisieren oder neu erstellen
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'e2e-failure',
              per_page: 20,
            });

            const existingForBranch = existing.data.find(i =>
              i.title.includes(`[E2E] Branch \`${branch}\``)
            );

            if (existingForBranch) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingForBranch.number,
                body: `## Neuer fehlgeschlagener Run – ${new Date().toISOString().split('T')[0]}\n\n${body}`,
              });
              console.log(`Issue #${existingForBranch.number} aktualisiert`);
            } else {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[E2E] Branch \`${branch}\` – ${failed.length} Test(s) fehlgeschlagen`,
                body,
                labels: ['bug', 'e2e-failure', priorityLabel],
              });
              console.log(`Issue #${issue.data.number} erstellt`);
            }

      - name: Issue schließen bei Erfolg
        if: steps.e2e.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'e2e-failure',
              per_page: 20,
            });

            const existingForBranch = existing.data.find(i =>
              i.title.includes(`[E2E] Branch \`${branch}\``)
            );

            if (existingForBranch) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingForBranch.number,
                body: `## ✅ Alle E2E-Tests bestanden\n\nDie Tests sind auf Branch \`${branch}\` wieder grün. Issue wird automatisch geschlossen.\n\n*Automatisch durch Branch E2E Agent Workflow*\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingForBranch.number,
                state: 'closed',
                state_reason: 'completed',
              });
              console.log(`Issue #${existingForBranch.number} geschlossen`);
            }
