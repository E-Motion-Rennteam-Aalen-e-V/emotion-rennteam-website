               github.ref_name) ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    env:
      E2E_CMS_USER: admin
      E2E_CMS_PASSWORD: test-password-ci
      CMS_ADMIN_USER: admin
      CMS_ADMIN_PASSWORD_HASH: ${{ secrets.CI_CMS_PASSWORD_HASH }}
      SESSION_SECRET: ${{ secrets.CI_SESSION_SECRET || 'ci-test-secret-32-chars-minimum!!' }}
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Playwright Browser installieren
        run: npx playwright install --with-deps chromium

      - name: Next.js Build erstellen
