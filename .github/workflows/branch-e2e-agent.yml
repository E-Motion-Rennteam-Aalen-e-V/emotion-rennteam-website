name: Branch E2E Agent – Endnutzer-Test

# Startet automatisch für jeden Push auf alle Feature-Branches
# sowie täglich um 04:00 UTC auf den Haupt-Branches.
on:
  push:
    branches:
      - website
      - cms-app
      - CMS-App-MacOs
      - cms-app-anleitung
      - "claude/**"
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to test (leave empty for current)"
        required: false

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-website:
    name: "E2E – Website (Endnutzer-Perspektive)"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # CMS-Zugangsdaten für e2e-Tests (Testumgebung)
      E2E_CMS_USER: admin
      E2E_CMS_PASSWORD: test-password-ci
      CMS_ADMIN_USER: admin
      CMS_ADMIN_PASSWORD_HASH: ${{ secrets.CI_CMS_PASSWORD_HASH }}
      SESSION_SECRET: ${{ secrets.CI_SESSION_SECRET || 'ci-test-secret-32-chars-minimum!!' }}
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Playwright Browser installieren
        run: npx playwright install --with-deps chromium

      - name: Next.js Build erstellen
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: E2E-Tests ausführen (Endnutzer-Flows)
        id: e2e
        run: npx playwright test --reporter=json,html
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json

      - name: Testergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.ref_name }}-${{ github.run_id }}
          path: |
            playwright-report/
            playwright-results.json
          retention-days: 14

      - name: Fehlgeschlagene Tests als Issue dokumentieren
        if: steps.e2e.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const branch = context.ref.replace('refs/heads/', '');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let resultJson = {};
            try {
              resultJson = JSON.parse(fs.readFileSync('playwright-results.json', 'utf8'));
            } catch (e) {
              console.log('Kein JSON-Report gefunden:', e.message);
            }

            // Fehlgeschlagene Tests sammeln
            const failed = [];
            for (const suite of (resultJson.suites || [])) {
              for (const spec of (suite.specs || [])) {
                for (const test of (spec.tests || [])) {
                  if (test.status === 'failed' || test.status === 'timedOut') {
                    failed.push({
                      title: spec.title,
                      error: test.results?.[0]?.error?.message || 'Unbekannter Fehler',
                    });
                  }
                }
              }
            }

            if (failed.length === 0) return;

            // Priorität bestimmen
            const hasCritical = failed.some(f =>
              f.title.toLowerCase().includes('login') ||
              f.title.toLowerCase().includes('auth') ||
              f.title.toLowerCase().includes('redirect')
            );
            const priority = hasCritical ? '🔴 P0 KRITISCH' : '🟠 P1 HOCH';
            const label = hasCritical ? 'P0-critical' : 'P1-high';

            const failList = failed.map(f =>
              `### \`${f.title}\`\n\`\`\`\n${f.error.substring(0, 500)}\n\`\`\``
            ).join('\n\n');

            const body = `## ${priority} – E2E-Tests fehlgeschlagen

**Branch:** \`${branch}\`
**CI-Run:** ${runUrl}
**Datum:** ${new Date().toISOString().split('T')[0]}
**Fehlgeschlagene Tests:** ${failed.length}

---

${failList}

---

## Nächste Schritte

1. CI-Artifact herunterladen für vollständigen Playwright-Report
2. Test lokal reproduzieren: \`npx playwright test --headed\`
3. Fix implementieren und Branch pushen

*Automatisch erstellt durch Branch E2E Agent Workflow*

---
_Generated by [Claude Code](https://claude.ai/code)_`;

            // Bestehende offene Issues für diesen Branch prüfen
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'e2e-failure',
              per_page: 20,
            });

            const existingForBranch = existing.data.find(i =>
              i.title.includes(`[E2E] Branch \`${branch}\``)
            );

            if (existingForBranch) {
              // Bestehendes Issue aktualisieren
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingForBranch.number,
                body: `## Neuer fehlgeschlagener Run – ${new Date().toISOString().split('T')[0]}\n\n${body}`,
              });
            } else {
              // Neues Issue erstellen
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[E2E] Branch \`${branch}\` – ${failed.length} Test(s) fehlgeschlagen`,
                body,
                labels: ['bug', 'e2e-failure'],
              });
            }

  e2e-cms:
    name: "E2E – CMS-App (Admin-Flows)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
