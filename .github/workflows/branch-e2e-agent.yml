            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[CMS-E2E] Branch \`${branch}\` – CMS-Flow defekt (${failed.length} Tests)`,
              body,
              labels: ['bug', 'e2e-failure', 'cms'],
            });

  macos-script-lint:
    name: "macOS CMS-Startskript – Bash-Syntax-Check"
    runs-on: ubuntu-latest
    # Shellcheck für alle macOS-Startskripte

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck installieren
        run: sudo apt-get install -y shellcheck

      - name: Bash-Skripte prüfen
        id: shellcheck
        run: |
          EXIT=0
          for f in CMS-Start_macos.command CMS-Start.command CMS-Start.sh \
                   CMS-Zugangsdaten-aendern.sh CMS-Zugangsdaten-aendern.command \
                   scripts/cms-setup.sh scripts/cms-open-app.sh \
                   scripts/cms-update.sh; do
            if [ -f "$f" ]; then
              echo "=== Prüfe: $f ==="
              shellcheck --shell=bash --severity=warning "$f" || EXIT=1
            fi
          done
          exit $EXIT
        continue-on-error: true

      - name: ShellCheck-Fehler als Issue melden
        if: steps.shellcheck.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[P2 MITTEL] macOS/Shell-Skript – ShellCheck-Warnungen auf Branch \`${branch}\``,
              body: `## 🟡 MITTEL (P2) – Bash-Skript-Qualitätsprobleme\n\n**Branch:** \`${branch}\`\n**CI-Run:** ${runUrl}\n\nShellCheck hat Warnungen in den CMS-Startskripten gefunden. Details im CI-Log.\n\n*Automatisch erstellt durch Branch E2E Agent Workflow*\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`,
              labels: ['bug', 'macos', 'cms-launcher'],
            });
