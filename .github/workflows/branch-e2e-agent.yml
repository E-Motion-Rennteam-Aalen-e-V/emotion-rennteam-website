            let resultJson = {};
            try {
              resultJson = JSON.parse(fs.readFileSync('playwright-cms-results.json', 'utf8'));
            } catch (e) {}

            const failed = [];
            for (const suite of (resultJson.suites || [])) {
              for (const spec of (suite.specs || [])) {
                for (const test of (spec.tests || [])) {
