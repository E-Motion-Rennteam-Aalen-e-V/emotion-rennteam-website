      - name: Testergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-cms-report-${{ github.ref_name }}-${{ github.run_id }}
          path: |
            playwright-report/
            playwright-cms-results.json
